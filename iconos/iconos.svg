<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Fuente de los iconos. herramientas/iconos.cjs la dibuja a 16, 32, 48 y 128 px:
       en reposo el punto central es azul; con la clase «grabando», rojo. -->
  <style>
    #punto { fill: #2E86AB; }
    svg.grabando #punto { fill: #C8302B; }
  </style>
  <circle cx="64" cy="64" r="60" fill="#2E86AB"/>
  <circle cx="64" cy="64" r="40" fill="#FFFFFF"/>
  <circle id="punto" cx="64" cy="64" r="22"/>
</svg>
